[package]
name = "bim-desktop"
description = "桌面端外壳：egui + wgpu（eframe），选型见设计文档 1.6"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bim-desktop"
path = "src/main.rs"

[features]
# 默认【不】编译 GUI：eframe/wgpu 体量大（数百个依赖），`cargo build --workspace`
# 保持轻量、可秒级验证。
# M8 起点已实现第一版真实窗口（视口/拾取/属性面板，见 src/gui.rs）：
#   cargo run -p bim-desktop --features gui
default = []
gui = ["dep:eframe", "dep:egui", "dep:egui-wgpu", "dep:rfd", "dep:egui-phosphor", "dep:egui_dock"]
# 透传真实内核后端（M1）：`cargo run -p bim-desktop --features occt` 用真内核。
occt = ["core-kernel/occt", "core-app/occt"]

[lints]
workspace = true

[dependencies]
core-app.workspace = true
core-doc.workspace = true
core-interop.workspace = true
core-kernel.workspace = true
core-model.workspace = true
core-sdk.workspace = true
example-beam.workspace = true
glam.workspace = true
# M8：GUI 窗口要装载全部三个专业模块（视口直接看 M7 成果）。
# 铁律 8：根 Cargo.toml 仅 members 段允许加行（workspace.dependencies 不动），
# 故模块用 path 直连（与下方 dev-dependencies 原有先例同款）。
cable-tunnel = { path = "../../modules/cable-tunnel" }
hvac-duct = { path = "../../modules/hvac-duct" }
# GUI 依赖（默认关闭，见 [features]）
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
# M9：原生文件对话框（gui feature 门控）
rfd = { workspace = true, optional = true }
# G1：Phosphor 图标字体（gui feature 门控，主题在 src/theme.rs）
egui-phosphor = { workspace = true, optional = true }
# G6-M5：可停靠面板（gui feature 门控，DockState 在 src/gui.rs）
egui_dock = { workspace = true, optional = true }

# 仅测试用：e2e_mock.rs 直接开容器检查 drawing.json / views/ 段
[dev-dependencies]
zip.workspace = true
