[package]
name = "core-testkit"
description = "测试工具箱：夹具、黄金样本、跨层不变式自查（设计文档第 10 章）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# 透传真实内核后端（M1）：跨层集成用例可改用真实 occt-wasm 内核。
occt = ["core-kernel/occt", "core-app/occt"]

[dependencies]
core-kernel.workspace = true
core-model.workspace = true
core-doc.workspace = true
core-interop.workspace = true
core-sdk.workspace = true
core-app.workspace = true
glam.workspace = true
serde_json.workspace = true
