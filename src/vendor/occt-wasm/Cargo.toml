[package]
edition = "2024"
rust-version = "1.95"
name = "occt-wasm"
version = "4.0.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "OpenCascade CAD kernel via WebAssembly — no C++ toolchain required"
homepage = "https://github.com/andymai/occt-wasm"
documentation = "https://docs.rs/occt-wasm"
readme = "README.md"
keywords = [
    "cad",
    "opencascade",
    "wasm",
    "brep",
    "geometry",
]
categories = [
    "graphics",
    "science",
    "wasm",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/andymai/occt-wasm"

[features]
async = [
    "wasmtime/async",
    "dep:tokio",
]
default = []

[lib]
name = "occt_wasm"
path = "src/lib.rs"

[[example]]
name = "cli"
path = "examples/cli.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies.brotli]
version = "9"

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = ["rt"]
optional = true

[dependencies.wasmtime]
version = "48"

[lints.clippy]
dbg_macro = "deny"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
panic = "deny"
unwrap_used = "deny"

[lints.clippy.all]
level = "deny"
priority = -1

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
